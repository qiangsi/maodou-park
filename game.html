<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛豆乐园 - 玩游戏</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1a1a2e;color:#eee;font-family:"Press Start 2P",monospace,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
  h1{font-size:18px;color:#ffd93d;text-shadow:2px 2px 0 #000;margin:10px 0}
  #stageWrap{position:relative;image-rendering:pixelated;border:4px solid #000;box-shadow:6px 6px 0 #000;background:#000}
  canvas#stage{display:block;background:#7ec8e3}
  #preview{position:absolute;left:8px;bottom:8px;width:128px;height:96px;border:3px solid #000;image-rendering:pixelated;opacity:.9}
  #camHint{position:absolute;top:8px;right:8px;font-size:10px;color:#ffd93d;background:rgba(0,0,0,.7);padding:4px 8px;border:2px solid #000}
  .ui{margin:12px 0;max-width:800px;text-align:center}
  .btn{display:inline-block;background:#5aa437;color:#fff;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:10px 18px;font-size:13px;cursor:pointer;font-family:inherit;margin:4px}
  .btn:hover{background:#6dc247}
  .btn.alt{background:#3b5bb5}.btn.alt:hover{background:#4a6fd0}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  #msg{min-height:18px;font-size:11px;color:#ffd93d;margin:8px 0}
  .overlay{position:absolute;inset:0;background:rgba(10,10,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
  .overlay h2{color:#ffd93d;font-size:16px}
  .overlay p{font-size:11px;line-height:1.9;color:#ccc;max-width:480px}
  .overlay .big{font-size:26px;color:#fff}
  .hidden{display:none!important}
  .games{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
  .gbtn{background:#16213e;color:#eee;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:8px 12px;font-size:11px;cursor:pointer;font-family:inherit}
  .gbtn.active{background:#ffd93d;color:#000}
  input{background:#16213e;border:3px solid #000;color:#fff;font-family:inherit;font-size:13px;padding:8px;width:160px}
</style>
</head>
<body>
<h1>🟢 毛豆乐园</h1>
<div class="games" id="gamePicker">
  <button class="gbtn" data-g="fruit">🍉 切水果</button>
  <button class="gbtn" data-g="jump">🟢 跳跳豆</button>
  <button class="gbtn" data-g="freeze">🪵 木头人</button>
  <button class="gbtn" data-g="shout">🎈 大声喊气球</button>
</div>
<div id="stageWrap">
  <canvas id="stage" width="640" height="480"></canvas>
  <canvas id="preview" width="128" height="96"></canvas>
  <div id="camHint"></div>
  <div class="overlay" id="startOverlay">
    <h2>准备好了吗？</h2>
    <p>点击下方按钮，允许浏览器使用<b>摄像头</b>（画面只在本机识别，不录像不上传）。「大声喊气球」还会用到<b>麦克风</b>。</p>
    <p>站远一点，让上半身进入画面，然后挥手试试！</p>
    <button class="btn" id="startBtn">▶ 开启摄像头</button>
  </div>
  <div class="overlay hidden" id="overOverlay">
    <h2 id="overTitle">游戏结束</h2>
    <p class="big" id="overScore"></p>
    <p id="overExtra"></p>
    <input id="nameInput" placeholder="你的昵称" maxlength="12">
    <button class="btn" id="saveBtn">💾 提交到排行榜</button>
    <button class="btn alt" id="againBtn">↻ 再玩一次</button>
    <button class="btn alt" id="homeBtn">🏠 回首页</button>
  </div>
</div>
<div class="ui">
  <div id="msg">先选一个游戏，然后开启摄像头</div>
</div>
<script>globalThis.__LIGHTVELA_RELEASE_ID__="__LIGHTVELA_RELEASE_ID__";</script>
<script type="module" src="./game.js"></script>
</body>
</html>
