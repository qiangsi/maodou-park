<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛豆乐园 - 排行榜</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1a1a2e;color:#eee;font-family:"Press Start 2P",monospace,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
  h1{font-size:20px;color:#ffd93d;text-shadow:2px 2px 0 #000;margin-bottom:6px}
  .tabs{margin:14px 0;display:flex;flex-wrap:wrap;gap:6px}
  .tab{background:#16213e;color:#eee;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:8px 12px;font-size:11px;cursor:pointer;font-family:inherit}
  .tab.active{background:#ffd93d;color:#000}
  table{width:100%;max-width:640px;border-collapse:collapse;margin-top:10px}
  td,th{border:2px solid #000;padding:8px;font-size:12px}
  th{background:#16213e;color:#ffd93d}
  tr:nth-child(1) td:first-child{color:#ffd93d}
  tr:nth-child(2) td:first-child{color:#ccc}
  tr:nth-child(3) td:first-child{color:#cd7f32}
  #state{margin:12px 0;font-size:11px;color:#ffd93d;min-height:16px}
  a{color:#ffd93d}
</style>
</head>
<body>
<h1>🏆 毛豆乐园排行榜</h1>
<p style="font-size:11px;color:#999">总榜：所有游戏分数最高的 20 条记录</p>
<div class="tabs" id="tabs">
  <button class="tab active" data-g="">全部</button>
  <button class="tab" data-g="fruit">🍉 切水果</button>
  <button class="tab" data-g="jump">🟢 跳跳豆</button>
  <button class="tab" data-g="freeze">🪵 木头人</button>
  <button class="tab" data-g="shout">🎈 大声喊气球</button>
</div>
<div id="state">加载中…</div>
<table id="tbl"><thead><tr><th>#</th><th>游戏</th><th>昵称</th><th>分数</th><th>时间</th></tr></thead><tbody id="rows"></tbody></table>
<p style="margin-top:20px"><a href="./">← 回首页去玩</a></p>
<script>globalThis.__LIGHTVELA_RELEASE_ID__="__LIGHTVELA_RELEASE_ID__";</script>
<script>
const GAME_NAMES = { fruit: '切水果', jump: '跳跳豆', freeze: '木头人', shout: '大声喊气球' };
async function load(game) {
  const state = document.getElementById('state');
  state.textContent = '加载中…';
  try {
    const res = await fetch('/api/scores' + (game ? '?game=' + encodeURIComponent(game) : ''), {
      credentials: 'same-origin',
      headers: { 'X-Website-Release': globalThis.__LIGHTVELA_RELEASE_ID__ }
    });
    if (!res.ok) { state.textContent = '读取失败（HTTP ' + res.status + '）'; return; }
    const data = await res.json();
    if (!data.ok) { state.textContent = '读取失败'; return; }
    const rows = data.scores || [];
    const tb = document.getElementById('rows');
    if (rows.length === 0) { state.textContent = '还没有记录，快去玩一局！'; tb.innerHTML = ''; return; }
    state.textContent = '';
    tb.innerHTML = rows.map((r, i) =>
      `<tr><td>${i + 1}</td><td>${GAME_NAMES[r.game] || r.game}</td><td>${escapeHtml(r.name)}</td><td>${r.score}</td><td>${(r.created_at || '').slice(0, 16)}</td></tr>`
    ).join('');
  } catch (e) {
    state.textContent = '网络错误，读取失败。';
  }
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  load(t.dataset.g);
}));
load('');
</script>
</body>
</html>
